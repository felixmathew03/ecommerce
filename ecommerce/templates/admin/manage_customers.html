
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Customers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-6xl mx-auto mt-10 px-4">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Customer Management</h2>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full table-auto">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="px-6 py-3 text-left text-sm font-medium uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-sm font-medium uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-sm font-medium uppercase tracking-wider">Phone</th>
                        <th class="px-6 py-3 text-left text-sm font-medium uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-sm font-medium uppercase tracking-wider">Username</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    {% for customer in customers %}
                        <tr class="hover:bg-gray-100">
                            <td class="px-6 py-4 text-sm text-gray-700">{{ customer.id }}</td>
                            <td class="px-6 py-4 text-sm text-gray-700">{{ customer.cust_name }}</td>
                            <td class="px-6 py-4 text-sm text-gray-700">{{ customer.cust_phone }}</td>
                            <td class="px-6 py-4 text-sm text-gray-700">{{ customer.cust_email }}</td>
                            <td class="px-6 py-4 text-sm text-gray-700">{{ customer.cust_username }}</td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center text-gray-500">No customers found.</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
