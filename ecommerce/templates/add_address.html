{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Address</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Add Address</h1>

    <form method="post">
      {% csrf_token %}

      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Address Line 1</label>
        <input type="text" name="address_line1" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Address Line 2 (optional)</label>
        <input type="text" name="address_line2" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-2">City</label>
        <input type="text" name="city" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-2">State</label>
        <input type="text" name="state" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Postal Code</label>
        <input type="text" name="postal_code" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div class="mb-6">
        <label class="inline-flex items-center">
          <input type="checkbox" name="is_default" class="form-checkbox h-5 w-5 text-blue-600">
          <span class="ml-2 text-gray-700">Set as default address</span>
        </label>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">
        Save Address
      </button>
    </form>
  </div>

</body>
</html>
